<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Digital — Executive Admin Panel</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta property="og:image" content="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#F59E0B',
              goldLight: '#FBBF24',
              goldDark: '#D97706',
              bg: '#09090b',
              card: '#121215',
              cardHover: '#18181c',
              border: '#27272a',
              emerald: '#10B981'
            }
          },
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    .glass-card {
      background: rgba(18, 18, 21, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-gold {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(18, 18, 21, 0.8));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #09090b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    .pulse-live {
      animation: pulse-slow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen bg-[#09090b] text-zinc-100 flex flex-col antialiased selection:bg-amber-500/30 selection:text-amber-300">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Dynamic app render target -->
  </div>

  <script src="/assets/admin-app-v3.js?v=1786929548510"></script>
</body>
</html>
